<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐄</text></svg>">
  <title>Kopbal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b1e; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P", "Courier New", monospace; }
    canvas { touch-action: none; box-shadow: 0 0 40px rgba(95, 211, 95, 0.3); }

    /* Instellingen voor de aftrap */
    .instellen { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
      background: rgba(5, 5, 20, 0.88); padding: 16px; overflow-y: auto; }
    .instellen[hidden] { display: none; }
    .doos { background: #15153a; border: 4px solid #5fd35f; box-shadow: 8px 8px 0 #000; padding: 22px 18px;
      width: min(560px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; color: #fff; }
    .doos h2 { margin: 0 0 4px; font-size: 24px; color: #ffe14d; text-shadow: 3px 3px 0 #ff3ea5; }
    .doos h3 { margin: 6px 0 0; font-size: 11px; color: #3ef0ff; }
    .rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .doos button { font: 10px "Press Start 2P", "Courier New", monospace; color: #fff; background: #0b0b1e;
      border: 3px solid #555; padding: 12px 10px; cursor: pointer; line-height: 1.6; display: flex; align-items: center; gap: 8px; }
    .doos button.gekozen { border-color: #5fd35f; background: #1d3b1d; }
    .doos button img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .doos .aftrap { font-size: 14px; background: #5fd35f; color: #0b0b1e; border-color: #000; justify-content: center; padding: 14px; }
    .doos .klein { font-size: 8px; color: #8a8aa8; line-height: 1.9; margin: 0; }
    .camera { position: relative; width: min(320px, 80vw); aspect-ratio: 1; margin: 0 auto; border: 4px solid #ffe14d;
      overflow: hidden; background: #000; }
    .camera video, .camera img { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .camera img { transform: none; }
    .camera::after { content: ""; position: absolute; inset: 8%; border: 4px dashed rgba(255, 255, 255, 0.8); border-radius: 50%; }
  </style>
</head>
<body>
  <canvas id="scherm" width="800" height="450"></canvas>
  <div id="instellen" class="instellen" hidden></div>
  <script src="../../js/config.js?v=202610292027"></script>
  <script src="../../js/arcade.js?v=202610292027"></script>
  <script src="game.js?v=202610292027"></script>
</body>
</html>
